<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Interfaccia web locale per esplorare l'inventario di viaggio RouteStack.ai: voli, hotel e auto." />
    <title>RouteStack Web</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/components.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Salta al contenuto</a>

    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="#/flights" aria-label="RouteStack Web, vai ai voli">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12h18M3 6h18M3 18h12" />
            </svg>
          </span>
          <span>
            RouteStack
            <span class="brand__sub">Web · inventario viaggi</span>
          </span>
        </a>

        <nav class="tablist" role="tablist" aria-label="Sezioni di ricerca" id="tablist">
          <button class="tab" role="tab" id="tab-flights" aria-controls="app" aria-selected="true" tabindex="0" data-route="#/flights" type="button">
            <span class="tab__label">Voli</span>
          </button>
          <button class="tab" role="tab" id="tab-hotels" aria-controls="app" aria-selected="false" tabindex="-1" data-route="#/hotels" type="button">
            <span class="tab__label">Hotel</span>
          </button>
          <button class="tab" role="tab" id="tab-cars" aria-controls="app" aria-selected="false" tabindex="-1" data-route="#/cars" type="button">
            <span class="tab__label">Auto</span>
          </button>
        </nav>

        <span class="topbar__spacer" aria-hidden="true"></span>

        <div class="topbar__actions">
          <button class="btn btn--icon" id="theme-toggle" type="button" aria-label="Attiva tema scuro" title="Cambia tema">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
          <button class="btn btn--icon" id="settings-link" type="button" aria-label="Apri impostazioni" title="Impostazioni">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="layout" id="app" tabindex="-1">
      <p class="state__text">Caricamento dell'interfaccia…</p>
    </main>

    <div id="live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
